[project]
name = "claude-plays-pokemon"
version = "0.1.0"
description = "A minimal implementation of Claude playing Pokemon Red using the PyBoy emulator"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pyboy==2.2.0",
    "pillow",
    "numpy>=1.26,<2",
]
