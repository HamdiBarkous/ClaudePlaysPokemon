[project]
name = "pokemon-agent"
version = "0.1.0"
description = "An LLM agent that plays Pokemon Red through the PyBoy emulator"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jinja2>=3.1.6",
    "langchain-core>=1.0.0",
    "langchain-openai>=0.3.0",
    "langgraph>=1.0.6",
    "numpy>=1.26,<2",
    "pillow",
    "pyboy==2.2.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-frontmatter>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokemon_agent"]
